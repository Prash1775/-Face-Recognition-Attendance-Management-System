[theme]
primaryColor = "#3b82f6"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#c9d1d9"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"
showSidebarNavigation = false

[logger]
level = "info"

[server]
port = 8501
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
